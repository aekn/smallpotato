[project]
name = "smallpotato"
version = "0.1.0"
description = "Research on efficient streaming driving perception for constrained hardware."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pycocotools>=2.0.11",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "types-pycocotools>=2.0.0.20260518",
]

[tool.uv]
required-version = "==0.12.23"

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
    "--strict-config",
    "--strict-markers",
    "-ra",
]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error"]
xfail_strict = true

[tool.ruff]
target-version = "py312"
line-length = 79
preview = false
src = ["src", "reproductions", "tests"]

[tool.ruff.lint]
select = [
    "A",
    "B",
    "C4",
    "E4",
    "E7",
    "E9",
    "E501",
    "ERA",
    "F",
    "I",
    "PERF",
    "PGH",
    "PIE",
    "RUF",
    "T10",
    "TID252",
    "UP",
    "W505",
]

[tool.ruff.lint.pycodestyle]
max-doc-length = 72

[tool.ruff.lint.flake8-builtins]
ignorelist = ["input"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.pyright]
include = ["src", "tests", "reproductions"]
exclude = ["reproductions/**/smoke.py"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
reportImportCycles = "error"
reportMatchNotExhaustive = "error"
reportUnnecessaryCast = "error"
reportUnnecessaryIsInstance = "error"
reportUnnecessaryTypeIgnoreComment = "error"
