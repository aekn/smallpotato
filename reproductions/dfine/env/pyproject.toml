[project]
name = "dfine"
version = "0.1.0"
requires-python = "==3.11.9"
dependencies = [
    "calflops",
    "faster-coco-eval>=1.6.5",
    "numpy==1.26.4",
    "pyyaml",
    "scipy",
    "tensorboard",
    "torch==2.4.1",
    "torchvision==0.19.1",
    "transformers",
]

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
exclude-newer = false

[tool.uv]
package = false
required-version = "==0.12.23"
exclude-newer = "2024-11-08T23:59:59Z"
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
